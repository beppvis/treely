<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Image and Text</title>
    <style>
        .container {
            display: flex;
            align-items: center; /* Aligns text and image horizontally */
            max-width: 900px;
            text-align: left;
        }
        .text {
            max-width: 50%;
            margin-right: 20px;
        }
        .image-container {
            width: 250px;
            height: 250px;
            background-color: #203020;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        .image-container img {
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text">
            <h1>Our Vision</h1>
            <p>Sample text for alignment with the image.</p>
        </div>
        <div class="image-container">
            <img src="tree-icon.png" alt="Tree Image">
        </div>
    </div>
</body>
</html>
