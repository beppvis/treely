<!DOCTYPE html>
<html lang="en">

<head>

  <title>Treely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="styles/homeBar.css" rel="stylesheet">

  <link
    href="https://fonts.googleapis.com/css2?family=Modern+Antiqua&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>
<style>
  body {
    background-color: #F2F2F2;
    margin: 0px;
    padding: 0px;
  }

  .displayBar {
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    min-width: 400px;
    width: 400px;
    height: 630px;
    box-shadow: 2px 4px 10px black;
    border-radius: 11px;
    background-color: #FCFBDD;
    padding: 0px 0px 15px 0px;
    align-items: center;
    font-family: "Montserrat", sans-serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-style: normal;
    font-size: 24px;
    column-gap: 2px;
    gap: 21px;
    margin-bottom: 50px;
    margin-left: 30px;
  }

  .displayBar:hover {
    animation: moveUp 0.6s ease-in-out;
    animation-fill-mode: forwards;
  }

  


  #treeBar {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
    column-gap: 20px;
    row-gap: 40px;
    padding: 0px;

  }

  #treeBar::-webkit-scrollbar {
    width: 20px;
  }

  .displayBar h2 {
    font-size: 40px;
    color: black;
    margin: 0px 0px 0px 0px;
  }

  .displayBar center {
    font-size: 15px;
    width: 283px;
    height: 154px;
    margin: 0px 0px 0px 0px;
  }

  .displayBar .displayButtons {
    display: flex;
    margin: 0px 0px 0px 0px;
  }

  .displayBar .displayButtons button {
    margin-right: 21px;
    margin-left: 21px;
    margin-bottom: 0px;
    width: 105px;
    height: 45px;
    background-color: #BBD28A;
    border-radius: 4px;
    cursor: pointer;
  }
</style>

<script src="scripts/viewMore.js"></script>

<body onload="onLoad()" id="body">
  <div class="homeBar">
      <div class="logo"><a href="index.html">Treely</a>
          <div class="logoBottom">Plant a Billion Trees</div>
      </div>
      <div class="homeButtons">
          <button class="pageButton" onclick="window.location.href='./Howwework.html'">Our Work</button>
          <button class="pageButton" onclick="window.location.href='./Ourpeople.html'">Our People</button>
          <button class="pageButton" onclick="window.location.href='./index.html#plant'">Plant</button>
          <button class="pageButton" onclick="window.location.href='./index.html#donateToOrg'">Donate</button>
          <div class="userDropDown">
              <button class="profileButton" id="profilePic" onclick="window.location.href='./logIn.html'"></button>
              <div class="userDropDownContent">
                  <a href="cart.html">Cart</a>
              </div>
          </div>
      </div>
  </div>

  <br><br><br><br>
  <br><br><br><br>
  <div align="center" style="margin-top: 50px;">
    <h1 style="font-size: 50px; font-family: 'Montserrat', sans-serif; color: #000000;">Donate trees for forest creation
      <br> at just $1 per tree
    </h1>
    <br>
  </div>
  <div id="treeBar">


  </div>

</body>

</html>
